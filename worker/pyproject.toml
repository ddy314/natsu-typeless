[project]
name = "natsu-typeless-asr"
version = "0.1.0"
description = "Isolated Qwen3-ASR worker for Natsu Typeless"
requires-python = ">=3.12,<3.14"
dependencies = [
  "accelerate>=1.10,<2",
  "huggingface-hub>=0.34,<2",
  "numpy>=2.2,<3",
  "torch==2.13.0",
  "transformers==5.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natsu_typeless_asr"]
